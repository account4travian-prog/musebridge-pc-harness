[env:esp32-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    bblanchon/ArduinoJson@7.4.2
monitor_speed = 115200
upload_speed = 460800
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
; Use the USB-UART socket. Flash only the standard 8MB-compatible layout;
; this bridge needs no PSRAM and makes no assumptions about the clone LED.
